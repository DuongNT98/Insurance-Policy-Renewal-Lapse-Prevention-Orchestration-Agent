# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see the
# framework's manifest-schema reference for the full contract.
id: "INS-C2-056"
name: "Insurance Policy Renewal & Lapse Prevention Orchestration Agent"
namespace: "ins"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. RetentionOfferSelectNode / ContentGenerateNode /
# RetentionReportNode each build a fresh AzureOpenAIClient per invocation
# (src/services/llm_response.py build_azure_llm_client) to enhance the offer
# rationale / retention copy / campaign report. The offer itself is always
# selected from the config matrix (S-5 / 保険業法 第300条 — never LLM-generated).
# Any LLM failure (no secret bound, API error, empty response) degrades to the
# deterministic wording in src/services/llm_response.py default_* — never
# status=error. See docs/02_design.md.
generation_mode: "llm"  # deterministic | llm
industry: "INS"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "AgentBaseGraph"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.LapsePreventionGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# The three Azure OpenAI secrets back an enhancement-only LLM call (graceful
# degrade to the deterministic wording on any failure) — see
# src/services/llm_response.py build_azure_llm_client. Channel dispatch itself
# remains a local/mock abstraction for this engineering scope (real insurer
# backend / LINE Insurance integration is a per-insurer deployment concern,
# see docs/02_design.md).
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]

# generation_mode is deployment identity, not a tunable provider setting. Runtime
# parameters (max_retry, timeout_s, hitl, memory_enabled, high_value_premium_threshold_jpy, ...)
# live in config/config.yaml — AgentRegistry loads that file separately and passes
# it as Graph(config=...). Do NOT put them here.
